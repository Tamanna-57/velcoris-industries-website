<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velcoris Industries — Industrial Graphene, Made in India</title>
    <meta
      name="description"
      content="Velcoris Industries manufactures high-purity industrial graphene in Greater Noida, India — for defence, energy and aerospace, at a fraction of import cost."
    />
    <meta name="theme-color" content="#0A0B0D" />
    <link rel="preload" as="image" href="/media/hero-lattice.webp" type="image/webp" fetchpriority="high" />
    <script>
      // Set theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        document.documentElement.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
